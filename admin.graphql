# Contrat GraphQL du back-office : POST /api/graphql. Lecture seule, pour les écrans qui croisent
# plusieurs ressources : tableaux de bord (administrateurs) et demandes de réservation
# (gestionnaires et administrateurs). Il complète l'API REST (openapi.yml) sans la remplacer :
# les écritures et les autres écrans restent en REST.
#
# Toutes les statistiques portent sur la date de début des réservations, en heure de Paris.
# Chiffre d'affaires : réservations CONFIRMED et COMPLETED (montant figé à la création), en EUR.
#
# Erreurs : `errors[].extensions` reprend le schéma Error du contrat REST (`code`, `details`),
# avec en plus `status`, le statut HTTP qu'aurait renvoyé la même erreur en REST.

"""
Date de Paris, au format YYYY-MM-DD.
"""
scalar Date

"""
Instant au format ISO 8601, en UTC (2026-10-20T14:00:00.000Z), comme les date-time du REST.
"""
scalar DateTime

enum ReservationStatus {
  PENDING
  CONFIRMED
  REJECTED
  CANCELLED
  COMPLETED
}

enum RoomStatus {
  ACTIVE
  INACTIVE
}

"""
Pas de temps d'une série : jour, semaine (commence le lundi) ou mois.
"""
enum Granularity {
  DAY
  WEEK
  MONTH
}

"""
Critère de classement des salles.
"""
enum RoomSort {
  REVENUE
  RESERVATIONS
  BOOKED_HOURS
}

enum SortDirection {
  ASC
  DESC
}

"""
Période sur la date de début des réservations, bornes incluses. Une borne absente n'est pas appliquée.
"""
input PeriodInput {
  from: Date
  to: Date
}

type Query {
  """
  Tableau de bord sur une période (toutes les réservations si elle est absente).
  Seuls les champs demandés sont calculés.
  """
  dashboard(period: PeriodInput): Dashboard!
  """
  Demandes de réservation sur les salles du gestionnaire connecté (administrateur : toutes les
  salles), avec la salle et le demandeur. Réservé aux gestionnaires et aux administrateurs.
  """
  reservationRequests: ReservationRequests!
}

type Dashboard {
  """
  Début de la période demandée, ou null.
  """
  from: Date
  """
  Fin de la période demandée, ou null.
  """
  to: Date
  """
  Compteurs globaux, identiques à GET /admin/statistics. Utilisateurs et salles : sans tenir compte de la période.
  """
  statistics: Statistics!
  """
  Nombre de réservations et montant par statut. Tous les statuts sont présents, à 0 au besoin.
  """
  byStatus: [StatusBreakdown!]!
  """
  Série chronologique. Seuls les intervalles qui ont au moins une réservation sont présents.
  """
  timeline(granularity: Granularity! = DAY): [TimelinePoint!]!
  """
  Classement des salles, y compris celles sans réservation sur la période. limit : 1 à 50.
  """
  rooms(
    sort: RoomSort! = REVENUE
    direction: SortDirection! = DESC
    limit: Int! = 10
  ): [RoomPerformance!]!
  """
  Clients classés par chiffre d'affaires (au moins une réservation sur la période). limit : 1 à 50.
  """
  topClients(limit: Int! = 10): [ClientPerformance!]!
}

type Statistics {
  totalUsers: Int!
  totalRooms: Int!
  totalReservations: Int!
  confirmedReservations: Int!
  cancelledReservations: Int!
  totalRevenue: Float!
}

type StatusBreakdown {
  status: ReservationStatus!
  count: Int!
  amount: Float!
}

type TimelinePoint {
  """
  Premier jour de l'intervalle.
  """
  date: Date!
  reservations: Int!
  confirmedReservations: Int!
  revenue: Float!
}

type RoomSummary {
  id: ID!
  name: String!
  location: String!
  capacity: Int!
  pricePerHour: Float!
  status: RoomStatus!
}

type RoomPerformance {
  room: RoomSummary!
  reservations: Int!
  confirmedReservations: Int!
  revenue: Float!
  """
  Heures réservées (réservations confirmées).
  """
  bookedHours: Float!
}

type UserSummary {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
}

type ClientPerformance {
  user: UserSummary!
  reservations: Int!
  confirmedReservations: Int!
  revenue: Float!
}

type ReservationRequests {
  """
  Demandes en attente (PENDING), la plus proche d'abord. limit : 1 à 100.
  """
  pending(limit: Int! = 100): [ReservationRequest!]!
  """
  Demandes traitées (CONFIRMED, REJECTED, COMPLETED), la plus récente d'abord (date de début :
  la date de traitement n'est pas enregistrée). limit : 1 à 100.
  """
  handled(limit: Int! = 10): [ReservationRequest!]!
}

"""
Réservation vue par le gestionnaire de la salle : champs du schéma Reservation du REST, avec la
salle et le demandeur à la place de roomId et userId.
"""
type ReservationRequest {
  id: ID!
  room: RoomSummary!
  requester: UserSummary!
  startAt: DateTime!
  endAt: DateTime!
  status: ReservationStatus!
  numberOfParticipants: Int
  comment: String
  totalAmount: Float!
  currency: String!
  createdAt: DateTime!
}
